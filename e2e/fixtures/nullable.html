<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Nullable Controls Demo</title>
    <script src="../../node_modules/highcharts/highcharts.js"></script>
    <script type="module" src="/js/controls.js"></script>
</head>
<body>
    <div id="container" style="height: 250px; margin: 20px;"></div>
    <div id="controls-container" style="max-width: 400px;"></div>

    <script type="module">
        import HighchartsControls from '/js/controls.js';

        // Create a chart
        const chart = Highcharts.chart('container', {
            title: { text: 'Test Chart' },
            subtitle: { text: 'Subtitle' },
            series: [{
                name: 'Series 1',
                data: [1, 3, 2, 4],
                type: 'spline'
            }]
        });

        // Add controls using script API
        HighchartsControls.controls('controls-container', {
            display: 'block',
            controls: [
                {
                    group: 'Text Controls',
                    description: 'Text input with nullable support',
                    controls: [
                        { path: 'title.text', type: 'text', nullable: true }
                    ]
                },
                {
                    group: 'Number Controls',
                    description: 'Number input with nullable support',
                    controls: [
                        { path: 'yAxis[0].max', type: 'number', max: 10, nullable: true }
                    ]
                },
                {
                    group: 'Color Controls',
                    description: 'Color picker with nullable support',
                    controls: [
                        { path: 'series[0].color', type: 'color', nullable: true }
                    ]
                },
                {
                    group: 'Boolean Controls',
                    description: 'Tri-state toggle when nullable',
                    controls: [
                        { path: 'series[0].visible', type: 'boolean', nullable: true }
                    ]
                },
                {
                    group: 'Select Controls',
                    description: 'Select with nullable support. When subtitle align is null, it should inherit alignment from title.',
                    controls: [
                        { path: 'title.align', type: 'select', nullable: true, options: ['left', 'center', 'right'] },
                        { path: 'subtitle.align', type: 'select', nullable: true, options: ['left', 'center', 'right'] },
                        { path: 'series[0].dashStyle', type: 'select', nullable: true, options: ['Solid', 'ShortDash', 'ShortDot', 'ShortDashDot', 'ShortDashDotDot', 'Dot', 'Dash', 'LongDash', 'DashDot', 'LongDashDot', 'LongDashDotDot'] }
                    ]
                }
            ]
        });
    </script>
</body>
</html>
